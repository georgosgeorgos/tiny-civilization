<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How Tiny Civilization grows</title>
  <desc id="desc">Choose an origin, geography, resources, and seed. People build settlements, work the land, and trade with neighbors. The simulation advances resources, ecology, culture, and institutions. An observer reads the world and can guide council priorities.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fcfaf3"/>
      <stop offset="1" stop-color="#f1efe3"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#b8d8dd"/>
      <stop offset="1" stop-color="#85b5bd"/>
    </linearGradient>
    <linearGradient id="island" x2="0" y2="1">
      <stop stop-color="#e8d8a9"/>
      <stop offset="1" stop-color="#b9c899"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#233e3d" flood-opacity=".11"/>
    </filter>
    <clipPath id="scene-clip"><rect x="353" y="246" width="484" height="253" rx="17"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#59756b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .eyebrow { font: 700 12px system-ui, sans-serif; letter-spacing: .16em; fill: #627e70; }
      .title { font: 36px Georgia, serif; fill: #233d38; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #5f746c; }
      .panel-title { font: 25px Georgia, serif; fill: #243e39; }
      .copy { font: 15px system-ui, sans-serif; fill: #60746c; }
      .strong { font: 700 15px system-ui, sans-serif; fill: #294a42; }
      .pill { font: 600 13px system-ui, sans-serif; fill: #315349; }
      .small { font: 13px system-ui, sans-serif; fill: #61766d; }
      .card { fill: #fffef9; stroke: #d9e0d1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="27" fill="url(#paper)"/>
  <circle cx="1100" cy="-8" r="185" fill="#e5eee5" opacity=".6"/>
  <circle cx="60" cy="650" r="160" fill="#e4e9d6" opacity=".55"/>
  <text x="40" y="42" class="eyebrow">THE COUPLED CIVILIZATION</text>
  <text x="40" y="87" class="title">A world that remembers what its people do</text>
  <text x="42" y="115" class="subtitle">Set the first conditions, then watch generations change the land and one another.</text>

  <g filter="url(#lift)">
    <rect class="card" x="36" y="143" width="281" height="433" rx="23"/>
    <rect class="card" x="337" y="143" width="516" height="433" rx="23"/>
    <rect class="card" x="873" y="143" width="291" height="433" rx="23"/>
  </g>

  <text x="62" y="179" class="eyebrow">01 / CHOOSE</text>
  <text x="62" y="217" class="panel-title">A beginning</text>
  <text x="62" y="244" class="copy">Pick a home and a landscape.</text>
  <text x="62" y="264" class="copy">The seed shapes the first world.</text>

  <g>
    <rect x="62" y="291" width="108" height="69" rx="13" fill="#eef1e3" stroke="#d7dec9"/>
    <path d="M82 321l10-9 10 9v17H82z" fill="#d2a778" stroke="#8c7456" stroke-width="1.5"/>
    <path d="M79 321l13-11 13 11" fill="none" stroke="#735845" stroke-width="2.5" stroke-linecap="round"/>
    <text x="117" y="339" class="pill">Camp</text>
    <rect x="179" y="291" width="109" height="69" rx="13" fill="#edf1e8" stroke="#d7dec9"/>
    <path d="M196 337v-16l10-8 10 8v16" fill="#e2c7a1" stroke="#8c7456" stroke-width="1.5"/>
    <path d="M193 322l13-11 13 11" fill="none" stroke="#735845" stroke-width="2.5" stroke-linecap="round"/>
    <text x="226" y="339" class="pill">Village</text>
    <rect x="62" y="369" width="108" height="69" rx="13" fill="#f2eee6" stroke="#e1dacf"/>
    <rect x="80" y="395" width="19" height="28" rx="2" fill="#b49b81"/>
    <rect x="102" y="384" width="18" height="39" rx="2" fill="#c2aa8f"/>
    <text x="127" y="418" class="pill">City</text>
    <rect x="179" y="369" width="109" height="69" rx="13" fill="#e9eff0" stroke="#d1dee0"/>
    <circle cx="204" cy="403" r="14" fill="none" stroke="#648994" stroke-width="3"/>
    <circle cx="204" cy="403" r="4" fill="#648994"/>
    <text x="224" y="418" class="pill">Habitat</text>
  </g>
  <rect x="62" y="465" width="226" height="80" rx="14" fill="#f3f5eb"/>
  <text x="78" y="489" class="eyebrow">FIRST CONDITIONS</text>
  <text x="78" y="514" class="strong">Seed · terrain · stores</text>
  <text x="78" y="534" class="small">Same seed, same starting place.</text>

  <circle cx="327" cy="355" r="15" fill="#e5ebe0"/>
  <path d="M320 355h13m-5-5 5 5-5 5" fill="none" stroke="#527868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="360" y="179" class="eyebrow">02 / EVOLVE</text>
  <text x="360" y="217" class="panel-title">A living world</text>
  <text x="360" y="239" class="copy">People, work, land, and neighbors feed back into one another.</text>

  <g clip-path="url(#scene-clip)">
    <rect x="353" y="246" width="484" height="253" fill="url(#sea)"/>
    <path d="M310 344c38-55 90-85 156-79 48 4 81 30 117 31 47 1 72-35 131-23 45 9 91 51 139 50v222H310z" fill="#d8e5c1" opacity=".5"/>
    <path d="M323 361c26-34 70-67 121-67 53 0 84 32 131 29 47-2 72-31 119-17 43 12 68 43 132 44l30 193H322z" fill="url(#island)" stroke="#edf0cf" stroke-width="5"/>
    <path d="M357 422c80-27 122-15 171-45 44-26 76-24 115-5 39 18 74 36 140 24" fill="none" stroke="#bca37d" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M646 274c-18 31-24 58-7 90 12 22 20 41 10 72-7 20-8 38 2 63" fill="none" stroke="#d9eef0" stroke-width="19" stroke-linecap="round"/>
    <path d="M646 274c-18 31-24 58-7 90 12 22 20 41 10 72-7 20-8 38 2 63" fill="none" stroke="#71aab7" stroke-width="11" stroke-linecap="round"/>
    <g fill="#6c8c64">
      <circle cx="404" cy="332" r="15"/><circle cx="426" cy="346" r="19"/><circle cx="386" cy="367" r="15"/>
      <circle cx="453" cy="366" r="13"/><circle cx="740" cy="335" r="15"/><circle cx="766" cy="355" r="20"/>
      <circle cx="731" cy="385" r="12"/>
    </g>
    <g fill="#587b5c">
      <path d="M399 350v22m28-6v21m-40-4v18m65-22v20m289-48v21m25-1v24m-35 5v17" stroke="#587b5c" stroke-width="5"/>
    </g>
    <g>
      <path d="M487 402l29-22 29 22" fill="#965e47" stroke="#7c5544" stroke-width="3" stroke-linejoin="round"/>
      <rect x="493" y="402" width="46" height="36" rx="3" fill="#f3e9d1" stroke="#9d8b70" stroke-width="2"/>
      <rect x="512" y="416" width="10" height="22" fill="#9d7658"/>
      <path d="M554 391l21-17 21 17" fill="#8c6650" stroke="#755440" stroke-width="3"/>
      <rect x="560" y="391" width="30" height="31" rx="2" fill="#eee0c1" stroke="#9d8b70" stroke-width="2"/>
      <path d="M704 397l19-15 19 15" fill="#9b684b" stroke="#755440" stroke-width="3"/>
      <rect x="709" y="397" width="28" height="27" rx="2" fill="#eadfc6" stroke="#9d8b70" stroke-width="2"/>
    </g>
    <g fill="#a6be79" stroke="#88a262" stroke-width="1.5">
      <path d="M466 448l40-4 25 28-42 6z"/><path d="M524 446l35-7 28 29-43 5z"/>
      <path d="M680 444l34-7 26 28-39 6z"/>
    </g>
    <g stroke="#e4ebaf" stroke-width="3"><path d="M478 451l23 23m-9-27 23 27m23-28 25 25m13-30 27 28m78-28 25 27m-11-30 24 28"/></g>
    <g fill="#2c5048"><circle cx="602" cy="413" r="4"/><circle cx="616" cy="407" r="4"/><circle cx="604" cy="430" r="4"/></g>
    <g stroke="#2c5048" stroke-width="3" stroke-linecap="round"><path d="M602 418v11m14-17v10m-12 12v10"/></g>
    <rect x="366" y="261" width="114" height="31" rx="15" fill="#fffdf4" opacity=".94"/>
    <text x="381" y="282" class="pill">Land &amp; weather</text>
    <rect x="676" y="455" width="146" height="31" rx="15" fill="#fffdf4" opacity=".94"/>
    <text x="689" y="476" class="pill">Trade &amp; neighbors</text>
  </g>
  <rect x="354" y="515" width="482" height="43" rx="11" fill="#e9efe6"/>
  <text x="372" y="541" class="strong">Engine:</text>
  <text x="433" y="541" class="small">resources · ecology · generations · culture</text>

  <circle cx="863" cy="355" r="15" fill="#e5ebe0"/>
  <path d="M856 355h13m-5-5 5 5-5 5" fill="none" stroke="#527868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="898" y="179" class="eyebrow">03 / OBSERVE</text>
  <text x="898" y="217" class="panel-title">See the story</text>
  <text x="898" y="244" class="copy">Read change, then guide it.</text>
  <rect x="898" y="269" width="241" height="145" rx="15" fill="#f0f4ed" stroke="#d8e2d7"/>
  <text x="916" y="295" class="eyebrow">CHRONICLE · YEAR 12</text>
  <path d="M916 350l28-17 28 10 30-32 31 17 29-6 28-27 32 14" fill="none" stroke="#598977" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M916 352h205" stroke="#ccd8cb" stroke-width="1.5"/>
  <circle cx="1090" cy="295" r="5" fill="#d49c65"/>
  <text x="916" y="386" class="small">People grow · food recovers</text>
  <rect x="898" y="433" width="241" height="112" rx="15" fill="#edf1e3" stroke="#d8e1ce"/>
  <text x="916" y="460" class="eyebrow">COUNCIL DIRECTIVE</text>
  <text x="916" y="490" class="strong">Protect the forests</text>
  <text x="916" y="516" class="small">Priorities alter future choices.</text>

  <path d="M1012 589v18H565" fill="none" stroke="#789386" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
  <text x="47" y="619" class="eyebrow">THE FEEDBACK LOOP</text>
  <text x="232" y="619" class="small">New decisions return to the living world each season.</text>
</svg>
